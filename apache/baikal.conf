# Baikal serves CalDAV and CardDAV from the same script, html/dav.php.
#
# Everything else is already handled by the html/.htaccess that ships with the
# release: the 308 redirects for /.well-known/caldav and /.well-known/carddav,
# and passing HTTP_AUTHORIZATION through to PHP. This vhost therefore only has
# to point Apache at html/ and let AllowOverride honour that file.
#
# Do not add RewriteRules here. Duplicating the upstream rules is how the
# Authorization header gets dropped, and a dropped header does not look like a
# configuration error - it looks like every client suddenly having the wrong
# password.
<VirtualHost *:80>
    DocumentRoot /var/www/baikal/html

    <Directory /var/www/baikal/html>
        # FollowSymLinks is not cosmetic: mod_rewrite refuses to run in a
        # .htaccess without it, which silently disables the .well-known
        # redirects and with them client autodiscovery.
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nothing below html/ is web-servable: config/ holds baikal.yaml and
    # Specific/ holds the database. They stay outside DocumentRoot, which is
    # upstream's layout - keep it that way.

    # The base image symlinks both of these to /dev/stderr and /dev/stdout, so
    # this is container logging, not files piling up in the image.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
