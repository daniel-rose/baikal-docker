; Deltas on top of php.ini-production, which the Dockerfile installs.
;
; php.ini-production already turns display_errors off and log_errors on, so
; PHP errors end up in the container log instead of in an HTTP response. It
; leaves expose_php on, though.
;
; The DAV endpoint is reachable from the internet, and sabre/dav already
; discloses its own version in X-Sabre-Version with no way to switch that off.
; That is a reason to drop the disclosure we *can* drop, not a reason to shrug
; at it.
expose_php = Off
