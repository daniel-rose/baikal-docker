version: 2

# Dependabot covers both halves of this image: the base image in the Dockerfile
# and the actions in the workflows. It cannot cover Baikal itself - the build
# verifies the release against BAIKAL_SHA256, and no bot computes that - which
# is what .github/workflows/upstream-release.yml is for.
updates:
  # Only the FROM line. It is pinned as tag@sha256:digest on purpose: given a
  # bare digest, Dependabot never proposes an update at all.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Without this, the bot's commits are the only ones in the history that
      # are not Conventional Commits.
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
